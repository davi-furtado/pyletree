name: Bug Report
description: Report a bug or unexpected behavior
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below.
  
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: |
        I tried to run `pyletree . -fs` but it crashed with...
        I expected it to show file sizes, but instead...
    validations:
      required: true
  
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run `pyletree` with these options
        2. On this directory structure
        3. See the error
      validations:
        required: true
  
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your system info
      placeholder: |
        - **OS**: Windows 11 / macOS 14 / Ubuntu 22.04
        - **Python**: 3.11
        - **PyleTree version**: 2.7.0
      validations:
        required: true
  
  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Any error messages or stack traces
      render: python
  
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've checked existing issues for duplicates
          required: true
        - label: I can reproduce the issue reliably
          required: false
