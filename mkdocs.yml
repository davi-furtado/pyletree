site_name: PyleTree
site_description: Generate directory tree diagrams from the command line and Python API.
site_url: https://davi-furtado.github.io/pyletree
repo_url: https://github.com/davi-furtado/pyletree
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Usage: usage.md
  - API: api.md

theme: dracula

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
